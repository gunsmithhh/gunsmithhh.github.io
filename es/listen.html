<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escuchar — Gunnar Goldsmith</title>
<meta name="description" content="Elige dónde escuchar la música de Gunnar Goldsmith — Spotify, Apple Music, SoundCloud, Amazon Music y Tidal.">
<link rel="alternate" hreflang="en" href="https://gunnargoldsmith.com/listen.html">
<link rel="alternate" hreflang="fr" href="https://gunnargoldsmith.com/fr/listen.html">
<link rel="alternate" hreflang="de" href="https://gunnargoldsmith.com/de/listen.html">
<link rel="alternate" hreflang="es" href="https://gunnargoldsmith.com/es/listen.html">
<link rel="alternate" hreflang="pt" href="https://gunnargoldsmith.com/pt/listen.html">
<link rel="alternate" hreflang="it" href="https://gunnargoldsmith.com/it/listen.html">
<link rel="alternate" hreflang="ja" href="https://gunnargoldsmith.com/ja/listen.html">
<link rel="alternate" hreflang="zh" href="https://gunnargoldsmith.com/zh/listen.html">
<link rel="alternate" hreflang="ru" href="https://gunnargoldsmith.com/ru/listen.html">
<link rel="alternate" hreflang="x-default" href="https://gunnargoldsmith.com/listen.html">
<link rel="icon" type="image/png" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="index.html"><img class="wordmark-logo" src="../assets/logo.png" alt=""><span translate="no">Gunnar Goldsmith</span></a>
  </header>
  <main id="content">
    <p class="subtext">Cargando…</p>
  </main>

  <script src="../js/songs.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const song = SONGS.find((s) => s.id === id);
    const content = document.getElementById("content");
    content.innerHTML = "";

    if (!song) {
      const msg = document.createElement("p");
      msg.className = "subtext";
      msg.textContent = "Canción no encontrada.";
      const back = document.createElement("a");
      back.className = "back-link";
      back.href = "music.html";
      back.textContent = "← Volver a Música";
      content.appendChild(msg);
      content.appendChild(back);
    } else {
      const cover = document.createElement("div");
      cover.className = "track-cover";
      if (song.cover) {
        const img = document.createElement("img");
        img.src = "../" + song.cover;
        img.alt = song.title;
        cover.appendChild(img);
      } else {
        cover.classList.add("track-cover--placeholder");
        const span = document.createElement("span");
        span.textContent = song.title;
        cover.appendChild(span);
      }

      const title = document.createElement("h1");
      title.className = "track-title";
      title.textContent = song.title;

      const sub = document.createElement("p");
      sub.className = "track-sub";
      sub.textContent = "Elige dónde escuchar";

      const list = document.createElement("div");
      list.className = "link-list";

      const platforms = [
        ["Spotify", song.spotify],
        ["Apple Music", song.appleMusic],
        ["YouTube Music", song.youtubeMusic],
        ["SoundCloud", song.soundcloud],
        ["Amazon Music", song.amazonMusic],
        ["Tidal", song.tidal],
      ];

      let anyLinks = false;
      platforms.forEach(([label, url]) => {
        if (url) {
          anyLinks = true;
          const a = document.createElement("a");
          a.href = url;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = label;
          list.appendChild(a);
        }
      });

      content.appendChild(cover);
      content.appendChild(title);
      content.appendChild(sub);

      if (anyLinks) {
        content.appendChild(list);
      } else {
        const soon = document.createElement("p");
        soon.className = "subtext";
        soon.textContent = "Enlaces de streaming próximamente.";
        content.appendChild(soon);
      }

      const back = document.createElement("a");
      back.className = "back-link";
      back.href = "music.html";
      back.textContent = "← Volver a Música";
      content.appendChild(back);
    }
  </script>
</body>
</html>
