    <h1 class="page-title">ポートフォリオ</h1>
    <section class="photo-section">
      <h2 class="photo-section-title">クッキー</h2>
      <div class="photo-grid">
        <figure class="photo-item">
          <img src="../assets/portfolio/cookiegolds.jpeg" alt="Cookie the terrier panting in a red collar, side profile against a cloudy sky" loading="lazy">

        </figure>
        <figure class="photo-item">
          <img src="../assets/portfolio/cookiev2.jpeg" alt="Cookie the terrier sitting on grass, looking toward the camera" loading="lazy">

      </div>

    <section class="photo-section">
      <h2 class="photo-section-title">パラグライダー</h2>

        <figure class="photo-item">

          <figcaption class="photo-caption">ソロで滑空降下</figcaption>
        </figure>
        <figure class="photo-item">
          <img src="../assets/portfolio/PP2.jpeg" alt="A paraglider flying past a rocky cliff edge with a tree in silhouette" loading="lazy">
          <figcaption class="photo-caption">尾根を越えて</figcaption>
        </figure>
        <figure class="photo-item">
          <img src="../assets/portfolio/PP4.jpeg" alt="A paragliding pilot in a yellow helmet and mirrored goggles, geared up before takeoff" loading="lazy">
