<link rel="alternate" hreflang="en" href="https://gunnargoldsmith.com/music.html">
<link rel="alternate" hreflang="fr" href="https://gunnargoldsmith.com/fr/music.html">
<link rel="alternate" hreflang="de" href="https://gunnargoldsmith.com/de/music.html">
<link rel="alternate" hreflang="es" href="https://gunnargoldsmith.com/es/music.html">
<link rel="alternate" hreflang="pt" href="https://gunnargoldsmith.com/pt/music.html">
<link rel="alternate" hreflang="it" href="https://gunnargoldsmith.com/it/music.html">
<link rel="alternate" hreflang="ja" href="https://gunnargoldsmith.com/ja/music.html">
<link rel="alternate" hreflang="zh" href="https://gunnargoldsmith.com/zh/music.html">
<link rel="alternate" hreflang="ru" href="https://gunnargoldsmith.com/ru/music.html">

<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body class="music-body">
  <header class="site-header">
    <a class="wordmark" href="index.html"><img class="wordmark-logo" src="../assets/logo.png" alt=""><span translate="no">Gunnar Goldsmith</span></a>
  </header>
  <main class="music-main">
    <div id="hero"></div>
    <div id="grid" class="music-grid"></div>
  </main>

  <script src="../js/songs.js"></script>
  <script>
    const [featured, ...rest] = SONGS;
    const heroEl = document.getElementById("hero");

    function buildArt(song) {
      const art = document.createElement("div");
      art.className = "cover-art";
      if (song.cover) {
        const img = document.createElement("img");
        img.src = "../" + song.cover;
        img.alt = song.title;
        art.appendChild(img);
      } else {
        art.classList.add("cover-art--placeholder");
        const span = document.createElement("span");
        span.textContent = song.title;
        art.appendChild(span);
      }
      return art;
    }

    if (featured) {
      const heroLink = document.createElement("a");
      heroLink.className = "hero-cover";
      heroLink.href = `listen.html?id=${encodeURIComponent(featured.id)}`;
      heroLink.appendChild(buildArt(featured));
      heroEl.appendChild(heroLink);

      const heroCaption = document.createElement("p");
      heroCaption.className = "hero-caption";
      heroCaption.textContent = featured.title;
      heroEl.appendChild(heroCaption);
    }

    const grid = document.getElementById("grid");
    rest.forEach((song) => {
      const card = document.createElement("a");
      card.className = "cover-card";
      card.href = `listen.html?id=${encodeURIComponent(song.id)}`;
      card.appendChild(buildArt(song));

      const label = document.createElement("p");
      label.className = "cover-label";
      label.textContent = song.title;
      card.appendChild(label);

      grid.appendChild(card);
    });
  </script>
</body>
</html>
